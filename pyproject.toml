[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seedplane"
version = "0.12.0"
description = "Run language models as independent shards across CPU cores, GPUs and machines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy", "transformers>=4.45", "safetensors"]

[project.scripts]
seedplane = "seedplane.cli:main"

[tool.setuptools]
packages = ["seedplane"]
