[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seedplane"
version = "0.12.2"
description = "Run language models as independent shards across CPU cores, GPUs and machines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy", "transformers>=4.45", "safetensors"]
authors = [{name = "Robson"}]
keywords = ["llm", "inference", "sharding", "llama.cpp", "distributed-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/robson-apk/SeedPlane"
Documentation = "https://github.com/robson-apk/SeedPlane/blob/main/docs/API.md"
Issues = "https://github.com/robson-apk/SeedPlane/issues"

[project.scripts]
seedplane = "seedplane.cli:main"

[tool.setuptools]
packages = ["seedplane"]
