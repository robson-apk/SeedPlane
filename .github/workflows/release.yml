name: Release

# Builds the native runtime for Windows, Linux and macOS and attaches the archives to the GitHub release of a tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x86_64}
          - {os: macos-latest, name: macos-arm64}
          - {os: windows-latest, name: windows-x86_64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc ninja-build
      - if: runner.os == 'macOS'
        run: brew install molten-vk vulkan-loader vulkan-headers shaderc ninja
      - if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with: {vulkan_version: latest, install_runtime: false, cache: true, stripdown: true}
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cmake -S native/vulkan_decode -B build -A x64
          else cmake -S native/vulkan_decode -B build -G Ninja -DCMAKE_BUILD_TYPE=Release; fi
          cmake --build build --config Release
          mkdir -p seedplane-native-${{ matrix.name }} && cp -r build/shaders seedplane-native-${{ matrix.name }}/
          cp build/qwen_vk* seedplane-native-${{ matrix.name }}/ && cp native/vulkan_decode/README.md seedplane-native-${{ matrix.name }}/
          7z a seedplane-native-${{ matrix.name }}.zip seedplane-native-${{ matrix.name }} || zip -r seedplane-native-${{ matrix.name }}.zip seedplane-native-${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: seedplane-native-${{ matrix.name }}.zip
