name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q seedplane demo.py experiments docs
      - run: python demo.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: seedplane --help

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - name: Tokenizer tool builds with GCC
        run: g++ -std=c++17 -O2 -Wall -Wextra native/vulkan_decode/tools/tok_cli.cpp -o tok_cli
      - name: Engine compiles against the Vulkan headers (no GPU in CI)
        run: g++ -std=c++17 -fsyntax-only -Wall -Wextra -Wno-missing-field-initializers native/vulkan_decode/qwen_vk.cpp
